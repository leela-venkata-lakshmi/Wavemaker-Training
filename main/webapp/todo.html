<!DOCTYPE html>
<html lang="en" id="forTheme" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .hidden{
            display: none;
        }
        .import{
            top:50px;
        }
        .export{
            top: 100px;
        }
    </style>
</head>
<body class="bg-danger-subtle">
<div class=" d-flex flex-column align-items-center justify-content-center  ">
    <input type="file" id="fileInput" accept="application/json" class="hidden">
    <button id="themeBtn" class="btn  rounded-circle bg-dark text-white  position-absolute top-0 end-0 m-3"><i
            class="bi bi-moon"></i></button>
    <button id="import" class="btn import rounded-circle bg-dark text-white  position-absolute  end-0 m-3"><i
            class="bi bi-upload"><input type="file" class="hidden"></i></button>
    <button id="export" class="btn export  rounded-circle bg-dark text-white  position-absolute  end-0 m-3"><i
            class="bi bi-download"></i></button>


    <div class="m-5 text-center">
        <p class="h4">Make Your TODO List</p>
        <input type="text" id="searchInput" class="form-control" placeholder="Search tasks..."/>
        <div class="m-4">
            <label for="sortSelect" class="form-label">Sort By:</label>
            <select id="sortSelect" class="form-select">
                <option value="priority" selected>Priority</option>
                <option value="dateTime">Date & Time</option>
            </select>
        </div>
    </div>

    <div>
        <button id="addBtn" class="btn bg-success rounded border text-white px-3">Add Task</button>
    </div>
    <div>
        <form id="formInput" method="post" action="task">
            <div class="d-flex m-4" id="inputDiv">
                <input type="text" name="title" class="form-control" id="taskInput" placeholder="Enter task">
                <input type="date" name="dueDate" class="form-control" placeholder="Choose Date" required>
                <select class="form-select" name="priority" aria-label="Priority" required>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <input type="time" name="startTime" class="form-control p-0 startTime" placeholder="Start Time"
                       required>
                <input type="time" name="remainderTime" id="reminderTime" class="reminderInput m-0 p-2 rounded border"
                       placeholder="Reminder Time" required>
                <button type="submit" class="btn btn-primary" id="enterBtn">Enter</button>
            </div>
        </form>
    </div>
    <div id="todoList"></div>
   </div>

    <div class="modal fade" id="editTaskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editTaskModalLabel">Edit Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editTaskForm">
                        <input type="hidden" name="taskId" id="editTaskId">
                        <div class="mb-3">
                            <label for="editTaskTitle" class="form-label">Task Title</label>
                            <input type="text" class="form-control" id="editTaskTitle" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="editDueDate" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="editDueDate" name="dueDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPriority" class="form-label">Priority</label>
                            <select class="form-select" id="editPriority" name="priority" required>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editStartTime" class="form-label">Start Time</label>
                            <input type="time" class="form-control" id="editStartTime" name="startTime" required>
                        </div>
                        <div class="mb-3">
                            <label for="editReminderTime" class="form-label">Reminder Time</label>
                            <input type="time" class="form-control" id="editReminderTime" name="remainderTime" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="scripts/script.js"></script>
</body>
</html>
