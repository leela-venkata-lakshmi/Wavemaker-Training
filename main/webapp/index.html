<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-dark-subtle">
<h2 class="text-center p-5 mt-5">Login</h2>
<form action="login" method="post">
    <div  class="d-flex flex-column align-items-center justify-content-center">
    <div>
        <label for="username" class="text-bold">Username:</label>
        <input type="text" id="username" name="username" class="form-control" required>
    </div>
    <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <div>
        <button type="submit" class="btn btn-primary mt-3 px-3">Login</button>
    </div>
    </div>
</form>
<div class="text-center text-danger m-2" id="error-message"></div>
</body>
<script>
    const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            document.getElementById('error-message').textContent = "Invalid Credentials";
        }
</script>
</html>
